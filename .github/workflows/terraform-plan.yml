name: Terraform Plan

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "infra/terraform/**"

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5
      - name: Terraform static validation
        working-directory: infra/terraform
        run: |
          terraform init -backend=false
          terraform fmt -check
          terraform validate

      - name: Note
        run: echo "AWS terraform plan is intentionally not run without configured GitHub OIDC/AWS credentials."
